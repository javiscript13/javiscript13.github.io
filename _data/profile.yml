# Short profile text shown in the "About me" block on Home.
intro: "I'm Javier Hernandez, a technology and business process consultant based in Guatemala. I work where operations, technology and data meet, helping organizations understand how they work and turn that understanding into practical solutions."
es:
  intro: "Soy Javier Hernandez, consultor en tecnología y procesos de negocio radicado en Guatemala. Trabajo donde se encuentran las operaciones, la tecnología y los datos, ayudando a las organizaciones a entender cómo funcionan y a convertir ese entendimiento en soluciones prácticas."
