  contact_cta: "Conversemos"
  # About
  about_intro:
    - "Mi trayectoria abarca desarrollo de software, sistemas de negocio, coordinación de proyectos e iniciativas basadas en datos. A lo largo de los años he trabajado con empresas privadas, instituciones públicas y organizaciones sin fines de lucro, asumiendo distintos roles según lo que cada proyecto necesitaba: desde desarrollar software y mejorar procesos operativos hasta coordinar implementaciones y conectar datos de distintas fuentes."
    - "Esa diversidad de experiencias ha definido mi forma de abordar la tecnología: no como un fin en sí mismo, sino como un medio para atender necesidades reales de las organizaciones. Para mí es importante entender primero el problema, encontrar un camino práctico y asegurar que la solución funcione en el contexto donde se va a usar."
