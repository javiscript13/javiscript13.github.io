# Main menu. `key` is the label in _data/i18n.yml (nav.<key>), `url` is the English URL
# (the Spanish one is the same under /es). `match` (optional) lists extra URL prefixes that
# also mark the item as active. Work is a section of Home (/#work), not a menu item.
main:
  - key: home
    url: /
  - key: about
    url: /about/
