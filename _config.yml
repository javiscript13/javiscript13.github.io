title: "Javier Hernandez De Paz"
# Short name shown in the header. Personal identity for now; change here if the site gets a different brand.
brand: "@javiscript13"
email: "jahernandezdepaz@gmail.com"
phone: ""
address: "Guatemala"
description: "I help organizations improve the way they work through technology, data, and practical digital solutions."
logo: "/assets/images/logo.png"
logo_icon: "/assets/images/logo-b.png"
footer_content: "Technology & Business Process Consultant helping organizations improve the way they work through technology, data, and practical digital solutions."
copyright: "Javier Hernandez De Paz"   # shown as "© <build year> <copyright>" (see _includes/footer.html)


################## Social site ###############
social:
  - name: linkedin
    icon: "ti-linkedin"
    link: "https://linkedin.com/in/javiscript13"

  - name: github
    icon: "ti-github"
    link: "https://github.com/javiscript13"

# Build settings
permalink: "/:title"
markdown: kramdown
plugins:
  - jekyll-feed

# Scss Directory
sass:
  sass_dir: assets/scss
  style: compressed

#collections
collections:
  portfolios:
    output: true
  # Spanish project pages (/es/portfolios/<name>): one empty stub per project; the texts
  # come from the `es:` block of the file with the same name in _portfolios/.
  portfolios_es:
    output: true
    permalink: /es/portfolios/:path

# Languages: English is the default (no URL prefix); Spanish lives under /es/.
# UI texts are in _data/i18n.yml. A page is Spanish when its front matter says `lang: es`.
defaults:
  - scope:
      path: ""
      type: portfolios_es
    values:
      layout: portfolio
      lang: es

feed:
  collections:
    posts:
      path: "/index.xml"
