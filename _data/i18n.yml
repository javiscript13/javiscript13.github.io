  how_i_work_text:
    - "La mayor parte de mi trabajo comienza antes de elegir o implementar tecnología: primero entiendo cómo opera realmente una organización, qué necesita y qué solución práctica puede responder a ese contexto. A veces eso significa analizar un proceso, a veces coordinar un equipo y a veces escribir los scripts o el código que integran los datos. Mi experiencia como desarrollador es lo que me permite entender, evaluar e implementar las soluciones que recomiendo."
    - "Me interesan especialmente los problemas donde la tecnología tiene que adaptarse a un proceso complejo del mundo real, y no al revés, y los proyectos que hacen a las organizaciones más eficientes, transparentes o accesibles."
