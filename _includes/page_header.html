{% comment %} Sober page header: title and optional plain-text description on a warm surface. {% endcomment %}
<section class="page-header">
  <div class="container">
    <h1 class="page-header-title">{{ page.title }}</h1>
    {% if page.description %}<p class="page-header-text">{{ page.description }}</p>{% endif %}
  </div>
</section>
