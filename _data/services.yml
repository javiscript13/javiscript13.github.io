# Single source for the three main service areas shown on Home ("What I do": title + summary).
# The `complementary` capabilities are kept as reference content for projects / About copy;
# they are not rendered.
#
# Wording is limited to what is documented in the experience/project records
# (see _data/experiences.yml and the projects in _portfolios/). Supporting evidence
# per item, for review:
#   - Process analysis:  EXP-01 (process improvement, incident classification),
#                        EXP-04 (requirements gathering, client meetings).
#   - Tech consulting:   EXP-04, EXP-05 (technology lead), EXP-09 (technical advisor).
#   - Data & software:   EXP-09 (data integration/cleaning, reports), Mirador Electoral
#                        and Mirador Judicial (D3.js), Lagos Abiertos, 3 de 3 Guatemala.
#   - Digital workplace: Google Workspace setup/migration work in the project database.
#   - Learning platforms: Amidual (Chamilo), EXP-06, EXP-08 (educational platforms, Moodle).
#
# Fields: title (Home and the capability label on project pages), summary (Home),
#         icon (Themify icon class).
#         es (Spanish `title` and `summary`; the `complementary` list is reference copy
#         and is not translated).
main:
  - id: process-analysis
    title: "Process and Operations Optimization"
    icon: "ti-bar-chart-alt"
    summary: "Identifying bottlenecks, simplifying tasks, improving workflows, and reducing manual work."
    es:
      title: "Optimización de procesos y operaciones"
      summary: "Identificar cuellos de botella, simplificar tareas, mejorar flujos de trabajo y reducir el trabajo manual."

  - id: technology-consulting
    # No project card documents this capability on its own; it is backed by these experiences (see About).
    experiences: [EXP-09, EXP-05]
    title: "Digital Solutions and Management Systems"
    icon: "ti-layers"
    summary: "Turning operational needs into tools that make organizations work more effectively."
    es:
      title: "Soluciones digitales y sistemas de gestión"
      summary: "Convertir necesidades operativas en herramientas que faciliten el trabajo de las organizaciones."

  - id: data-software
    title: "Data Integration and Utilization"
    icon: "ti-pie-chart"
    summary: "Connecting information from different sources and turning it into useful insights for management and decision-making."
    es:
      title: "Integración y aprovechamiento de datos"
      summary: "Conectar información de distintas fuentes y convertirla en insumos útiles para la gestión y la toma de decisiones."

complementary:
  - id: digital-workplace
    title: "Digital Workplace & Collaboration"
    description: "Setting up, migrating and fixing Google Workspace for organizations: accounts and permissions, domain configuration and validation, and migration of historical email from legacy systems where possible."

  - id: learning-platforms
    title: "Learning Platforms & Digital Education"
    description: "Implementing and customizing learning platforms such as Chamilo and Moodle, setting up courses from instructional designs provided by others, and developing educational games."
